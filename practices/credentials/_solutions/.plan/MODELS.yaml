# Tier -> model mapping. The graph references TIERS, never model names,
# so the whole build can be re-pointed without touching a single brief.
# plan_threshold_tokens ~= 40% of the context window.

tiers:
  reasoning_high:
    model: claude-opus-5
    context_window: 200000
    plan_threshold_tokens: 80000
    used_by: [verifier, adversary, proof-session orchestrator (350)]
    notes: cold-read judgement (V9, V14, V15, V17, V18) and the control runs; fires rarely

  reasoning_mid:
    model: claude-sonnet-5
    context_window: 200000
    plan_threshold_tokens: 80000
    used_by: [integrator]
    notes: build contract (020), grade wrapper + flip (200), trap strengthening (330)

  fast:
    model: claude-sonnet-5
    context_window: 200000
    plan_threshold_tokens: 80000
    used_by: [worker, surveyor]
    notes: >
      Sonnet, not Haiku: workers plant subtle, idiomatic Rust/Dart defects that must stay
      invisible to the suite; a weaker model writes traps that narrate themselves.
      Re-point to claude-haiku-4-5-20251001 only for pure-doc nodes if cost matters.

  none:
    used_by: [router, tool, human_gate]

# Adversary nodes (300/310/332/334) ARE "the assistant of the day" a learner would drive.
# Run them on the strongest general assistant (claude-opus-5), which also differs from the
# builders' model. To test robustness, re-run once on claude-fable-5-1 and record both.
adversary_model: claude-opus-5
adversary_family_differs: true
