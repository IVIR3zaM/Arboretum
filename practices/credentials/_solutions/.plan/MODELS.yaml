# Tier -> model mapping. The graph references TIERS, never model names,
# so the whole build can be re-pointed without touching a single brief.
# plan_threshold_tokens ~= 40% of the context window.
#
# Decision 2026-09-14 (user): judgement tiers on Opus 4.8; low-effort tier on Sonnet.
# Cloud runner: the orchestrator session runs on "Opus 4.8" (pick it in the session's model selector).
#   - reasoning_high / reasoning_mid subagents: spawn with NO model override, so they inherit Opus 4.8.
#   - fast subagents: spawn with model "sonnet".

tiers:
  reasoning_high:
    model: Opus 4.8            # inherit from the orchestrator
    context_window: 200000
    plan_threshold_tokens: 80000
    used_by: [verifier, adversary, proof-session orchestrator (350)]

  reasoning_mid:
    model: Opus 4.8            # inherit from the orchestrator
    context_window: 200000
    plan_threshold_tokens: 80000
    used_by: [integrator]
    notes: build contract (020), grade wrapper + flip (200), trap strengthening (330)

  fast:
    model: sonnet              # Agent tool model override "sonnet"
    context_window: 200000
    plan_threshold_tokens: 80000
    used_by: [worker, surveyor]
    notes: >
      Sonnet, not Haiku: workers plant subtle, idiomatic Rust/Dart defects that must stay
      invisible to the suite; a weaker model writes traps that narrate themselves.

  none:
    used_by: [router, tool, human_gate]

# Control runs (300/310/332/334) are cold subagents that inherit Opus 4.8. This is recorded in
# practice.json -> controlRun and the proof as "Opus 4.8 as the learner's assistant".
adversary_model: Opus 4.8
adversary_family_differs: false
