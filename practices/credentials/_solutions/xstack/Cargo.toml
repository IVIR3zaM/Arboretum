[package]
name = "xstack"
version = "0.1.0"
edition = "2021"
publish = false
description = "Axis (b) cross-stack check: the backend verifier against the wallet's presentation."

[[bin]]
name = "xstack"
path = "src/main.rs"

# Every dependency is inside the backend's locked set (offline, --locked).
[dependencies]
credentials-backend = { path = "../../backend" }
ed25519-dalek = "=3.0.0"
serde_json = "=1.0.151"
