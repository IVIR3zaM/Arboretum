[package]
name = "credentials-probes"
version = "0.1.0"
edition = "2021"
publish = false
description = "Examiner-only robustness probes, backend half. Never part of the graded gate."

# Built by _solutions/robustness-probes.sh in a temp copy whose path dependency
# points at the graded tree's backend/, on the backend's own Cargo.lock
# (offline, --locked). Every dependency is a version that lock already holds.
[[bin]]
name = "probes"
path = "src/main.rs"

[dependencies]
credentials-backend = { path = "../../../backend" }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "time", "test-util"] }
url = "=2.5.8"

[workspace]
