[package]
name = "credentials-grader"
version = "0.1.0"
edition = "2021"
publish = false

# Axis (a): Ticket 1 acceptance. Calls the verification root
# (`Verifier::verify_credential` / `Verifier::resolve_issuer`) directly, never
# the presentation handler. Every dependency is a version already locked by
# `backend/Cargo.lock`, so the backend's `cargo fetch` makes this crate build
# with `--offline --locked`.

[[bin]]
name = "grade"
path = "src/main.rs"

# Axis (a2): Ticket 2 acceptance. Drives the notifier root
# (`Notifier::notify`) under tokio's paused clock (`test-util`, a feature of
# the backend's own locked tokio).
[[bin]]
name = "grade-a2"
path = "src/a2.rs"

[dependencies]
credentials-backend = { path = "../../backend" }
ed25519-dalek = "=3.0.0"
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "time", "test-util"] }
url = "=2.5.8"

[workspace]
